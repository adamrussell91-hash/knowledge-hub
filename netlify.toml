[build]
  command = "echo 'API only — the site is GitHub Pages'"
  publish = "netlify/public"
  functions = "netlify/handlers"

[functions]
  included_files = ["prompts/clementine-*.md", "prompts/annotation-voice.md", "prompts/tidy.md"]

[functions.tidy]
  timeout = 26

[build.environment]
  # Public CORS origin and R2 bucket name — not secrets. Netlify's scanner
  # fails Git deploys when these values appear in .env.example / wrangler config.
  SECRETS_SCAN_OMIT_KEYS = "SITE_ORIGIN,R2_BUCKET"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

[[redirects]]
  from = "/api/auth-login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth-logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]

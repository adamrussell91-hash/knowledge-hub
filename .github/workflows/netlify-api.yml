name: Deploy Netlify API

on:
  push:
    branches: [main]
    paths:
      - "netlify/**"
      - "src/chat/**"
      - "src/clementine/**"
      - "src/research/**"
      - "prompts/clementine-*.md"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/netlify-api.yml"
  workflow_dispatch:

concurrency:
  group: netlify-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Netlify deploy secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=
          [ -n "$NETLIFY_AUTH_TOKEN" ] || missing="$missing NETLIFY_AUTH_TOKEN"
          [ -n "$NETLIFY_SITE_ID" ] || missing="$missing NETLIFY_SITE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "From a book web search cannot go live without a Netlify API deploy."
            echo "Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID under repo Settings → Secrets → Actions,"
            echo "then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy API functions to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify deploy --prod --dir=netlify/public --functions=netlify/handlers --message "main ${GITHUB_SHA}"

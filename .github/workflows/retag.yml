name: Retag notes

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "Optional single page ID to retag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: adamrussell91-hash/knowledge-hub-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          fetch-depth: 0

      - name: Retag notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_ID: ${{ inputs.page_id }}
        run: |
          if [ -n "$PAGE_ID" ]; then
            npm run retag -- --id "$PAGE_ID" --data-dir data-repo
          else
            npm run retag -- --data-dir data-repo
          fi

      - name: Commit retag artifacts
        working-directory: data-repo
        run: |
          git config user.name "knowledge-hub-retag"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages manifest.json
          git diff --cached --quiet && echo "No retag changes" && exit 0
          git commit -m "Map topic tags onto the closed vocabulary."
          bash ../scripts/push-data-repo.sh

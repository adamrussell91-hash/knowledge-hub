name: Tidy notes

on:
  schedule:
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      page_id:
        description: "Optional single page ID to tidy"
        required: false
        type: string
      backfill_model_limit:
        description: "Optional paid backfill page limit (for example 100 for the cost pilot)"
        required: false
        type: number

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: adamrussell91-hash/knowledge-hub-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          fetch-depth: 0

      - name: Configure tidy author
        working-directory: data-repo
        run: |
          git config user.name "knowledge-hub-tidy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tidy notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_ID: ${{ inputs.page_id }}
          BACKFILL_MODEL_LIMIT: ${{ inputs.backfill_model_limit }}
        run: |
          if [ -n "$BACKFILL_MODEL_LIMIT" ] && [ "$BACKFILL_MODEL_LIMIT" -gt 0 ]; then
            npm run tidy:backfill -- --data-dir data-repo --model-limit "$BACKFILL_MODEL_LIMIT" --batch-size 5
          elif [ -n "$PAGE_ID" ]; then
            npm run tidy -- --id "$PAGE_ID" --data-dir data-repo
          else
            npm run tidy -- --scan --count 1 --data-dir data-repo
          fi

      - name: Commit tidy artifacts
        if: always()
        working-directory: data-repo
        run: |
          git add pages manifest.json _tidy
          git diff --cached --quiet && echo "No tidy changes" && exit 0
          git commit -m "Tidy archive notes."
          bash ../scripts/push-data-repo.sh

<!doctype html>
<html lang="en" data-hub="knowledge">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Sign in — Knowledge Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./login.css" />
    <style>
      /* iOS Safari zooms (and often swallows Go) below 16px. */
      .sign-in__input { font-size: 1rem; }
    </style>
  </head>
  <body>
    <div class="sign-in">
      <form class="sign-in__card" method="post" action="/api/auth-login" novalidate>
        <div class="sign-in__haze" aria-hidden="true">
          <span class="sign-in__haze-mist"></span>
          <span class="sign-in__bubble"></span>
          <span class="sign-in__bubble"></span>
          <span class="sign-in__bubble"></span>
          <span class="sign-in__bubble"></span>
          <span class="sign-in__bubble"></span>
          <span class="sign-in__sparkle"></span>
          <span class="sign-in__sparkle"></span>
          <span class="sign-in__sparkle"></span>
          <span class="sign-in__sparkle"></span>
          <span class="sign-in__sparkle"></span>
          <span class="sign-in__sparkle"></span>
        </div>
        <p class="sign-in__brand">Knowledge Hub</p>
        <h1 class="sign-in__title">Sign in</h1>
        <div class="sign-in__field">
          <label class="sign-in__label" for="sign-in-passphrase">Passphrase</label>
          <input
            class="sign-in__input"
            id="sign-in-passphrase"
            name="passphrase"
            type="password"
            required
            autocomplete="current-password"
            enterkeyhint="go"
          />
        </div>
        <input type="hidden" name="return_to" id="sign-in-return-to" value="https://knowledge-hub.adam-russell.com/" />
        <p class="sign-in__error" id="sign-in-error" role="alert" hidden></p>
        <button class="btn btn--primary sign-in__submit" type="submit">Sign in</button>
      </form>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const returnTo = params.get("return_to") || "https://knowledge-hub.adam-russell.com/";
      document.getElementById("sign-in-return-to").value = returnTo;
      if (params.get("signin") === "invalid") {
        const error = document.getElementById("sign-in-error");
        error.hidden = false;
        error.textContent = "Invalid passphrase";
      }
    </script>
  </body>
</html>
